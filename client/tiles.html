<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tile viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        color: #e8e8e8;
        font: 13px system-ui, sans-serif;
      }
      #view {
        position: fixed;
        top: 0;
        left: 360px;
        width: calc(100% - 360px);
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 360px;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 10px 12px 16px;
        background: rgb(16 17 20 / 0.88);
        border-right: 1px solid #333;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa;
        margin: 14px 0 6px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        margin: 4px 0;
      }
      button,
      select,
      input[type="number"] {
        background: #24262b;
        color: inherit;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 3px 7px;
        font: inherit;
      }
      button:hover {
        background: #30333a;
      }
      input[type="number"] {
        width: 80px;
      }
      label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 220px;
        background: #0c0d0f;
        color: #dfe;
        border: 1px solid #444;
        font: 12px/1.25 ui-monospace, Consolas, monospace;
        white-space: pre;
      }
      .error {
        color: #ff8a80;
        white-space: pre-wrap;
      }
      .muted {
        color: #8a8f98;
      }
      .info table {
        border-collapse: collapse;
        width: 100%;
      }
      .info td {
        padding: 1px 4px;
        border-bottom: 1px solid #2a2c31;
        vertical-align: top;
      }
      .bad {
        color: #ff8a80;
      }
      .good {
        color: #9be59b;
      }
      .maps {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .map {
        display: grid;
        gap: 0;
        width: max-content;
      }
      .map .cell {
        width: 22px;
        height: 22px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 12px ui-monospace, Consolas, monospace;
        cursor: pointer;
        color: #111;
        border: 1px solid rgb(0 0 0 / 0.25);
      }
      .map .cell.selected {
        outline: 2px solid #ffe14d;
        outline-offset: -2px;
        z-index: 1;
      }
      .map .cell.entrance::after {
        content: "";
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #fff;
        margin-left: 1px;
      }
      #help {
        position: fixed;
        right: 10px;
        bottom: 10px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.55);
        color: #ddd;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="panel"></div>
    <div id="help"></div>
    <script type="module" src="./src/tileViewer.ts"></script>
  </body>
</html>
