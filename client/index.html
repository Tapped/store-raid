<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friday Fun</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: system-ui, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #status,
      #hint {
        position: fixed;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgb(0 0 0 / 0.55);
        color: #fff;
        font-size: 13px;
      }
      #status {
        top: 12px;
        left: 12px;
        pointer-events: none;
      }
      #hint {
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status"></div>
    <div id="hint"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
